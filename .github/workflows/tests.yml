name: Unit Tests

on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"

jobs:
  test-zsh:
    name: ZSH Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ZSH
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run ZSH Unit Tests
        run: ./tests/run_tests.zsh

  test-python:
    name: Python Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python Unit Tests
        run: python3 -m unittest discover -s tests

  test-node:
    name: Node Unit Tests (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24", "26"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Node Unit Tests
        run: node --test tests/node/*.test.js

  test-go:
    name: Go Unit Tests (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: app/catstar-backup/go.sum

      - name: Run Go Unit Tests
        working-directory: app/catstar-backup
        run: go test -v -race -cover ./...
